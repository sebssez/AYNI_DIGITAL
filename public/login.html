<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kallpa Cacao · Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="display:grid; place-items:center; min-height:100vh; padding:1rem;">
  <div class="auth-box" style="width:100%; margin:0;">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <span style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.15em; color:#153E5C; font-weight:700;">Plataforma Oficial</span>
      <h1 class="serif" style="font-size:2.3rem; margin-top:0.25rem;">Kallpa Cacao</h1>
      <p style="font-size:0.9rem; opacity:0.75;">Inicia sesión para acceder a la tienda o a tu taller.</p>
    </div>

    <form id="form-login">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" class="input" required placeholder="tu@correo.com">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="input" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%;">Ingresar</button>
    </form>

    <p style="margin-top:1.25rem; font-size:0.88rem; text-align:center;">
      ¿Aún no tienes cuenta? <a href="/registro.html" style="color:#153E5C; font-weight:700;">Regístrate aquí</a>
    </p>
  </div>

  <script src="/js/api.js" defer></script>
  <script src="/js/auth.js" defer></script>
</body>
</html>
