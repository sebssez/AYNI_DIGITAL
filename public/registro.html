<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kallpa Cacao · Crear Cuenta</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="display:grid; place-items:center; min-height:100vh; padding:1rem;">
  <div class="auth-box" style="width:100%; margin:0;">
    <h1 class="serif" style="font-size:2rem; margin-bottom:0.4rem;">Crear Cuenta</h1>
    <p style="font-size:0.88rem; opacity:0.75; margin-bottom:1.25rem;">Elige cómo deseas participar en Kallpa Cacao.</p>

    <form id="form-registro">
      <div class="form-group">
        <label for="nombre">Nombre completo o Taller</label>
        <input type="text" id="nombre" class="input" required placeholder="Ej. Taller Cacao Quillabamba">
      </div>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" class="input" required placeholder="tu@correo.com">
      </div>
      <div class="form-group">
        <label for="rol">Tipo de cuenta (Rol)</label>
        <select id="rol" class="input" required>
          <option value="usuario">Usuario (Comprar chocolates)</option>
          <option value="artesano">Artesano (Comprar y vender mis productos)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="input" required minlength="6" placeholder="Mínimo 6 caracteres">
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%;">Crear mi cuenta</button>
    </form>

    <p style="margin-top:1.25rem; font-size:0.88rem; text-align:center;">
      ¿Ya tienes cuenta? <a href="/login.html" style="color:#153E5C; font-weight:700;">Inicia sesión</a>
    </p>
  </div>

  <script src="/js/api.js" defer></script>
  <script src="/js/auth.js" defer></script>
</body>
</html>
